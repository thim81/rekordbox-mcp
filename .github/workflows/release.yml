
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          config = tomllib.loads(
              Path("pyproject.toml").read_text()
          )
          version = config["project"]["version"]
          tag = os.environ["RELEASE_TAG"]

          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")

          if tag != f"v{version}":
              raise SystemExit(
                  f"Tag {tag} does not match package version {version}"
              )

          print(f"Releasing {tag}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev --frozen

      - name: Run tests
        run: uv run --frozen --extra dev pytest

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code origin \
              "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag already exists: $RELEASE_TAG"
              exit 1
            fi

            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
